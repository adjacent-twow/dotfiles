# No shadows
shadow = false;

# Fading animations
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

# Blur
#blur-method = "dual_kawase";
#blur-strength = 5;

# Transparency handling
backend = "glx";
vsync = false;

# Window opacity
inactive-opacity = 0.95;
active-opacity = 1.0;

# Rounded corners off
corner-radius = 5;

# Performance
use-damage = true;

# Exclude fullscreen apps from compositing
# unredir-if-possible = true;
