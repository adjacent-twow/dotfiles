[window]
opacity = 0.75
padding = { x = 10, y = 10 }
dynamic_padding = true

[colors]
transparent_background_colors = true

[font]
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
size = 12

[cursor]
style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
